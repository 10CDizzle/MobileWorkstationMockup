<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Casework — your desk setup, waiting at every hotel.">
  <defs>
    <style>
      .t { font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .h { font-size: 62px; font-weight: 700; letter-spacing: -1.6px; fill: #fbf9f6; }
      .s { font-size: 25px; font-weight: 400; fill: #a9bcc9; }
      .w { font-size: 30px; font-weight: 700; letter-spacing: -0.4px; fill: #fbf9f6; }
      .p { font-size: 21px; font-weight: 600; letter-spacing: 1.4px; fill: #11212f; }
      .panel { fill: #132433; stroke: #fbf9f6; stroke-width: 3.4; }
      .screen { fill: #0b1824; }
      .bar { fill: #41607a; }
      .foam { fill: #22384a; }
      .amber { fill: #f2a33c; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#11212f"/>
  <rect x="0" y="0" width="1200" height="8" fill="#d97a12"/>

  <!-- wordmark -->
  <g transform="translate(80 70)">
    <rect x="0" y="6" width="34" height="24" rx="5" fill="none" stroke="#fbf9f6" stroke-width="3"/>
    <path d="M11 6V3a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v3" fill="none" stroke="#fbf9f6" stroke-width="3" stroke-linecap="round"/>
    <rect x="12" y="14" width="10" height="8" rx="2" class="amber"/>
    <text x="48" y="30" class="t w">Casework</text>
  </g>

  <!-- headline -->
  <text x="80" y="300" class="t h">Your desk setup,</text>
  <text x="80" y="372" class="t h">waiting at every hotel.</text>
  <text x="80" y="430" class="t s">Two monitors, a dock and a full-size keyboard &#8212; shipped</text>
  <text x="80" y="464" class="t s">to your hotel before you check in. One monthly price.</text>

  <rect x="80" y="506" width="300" height="52" rx="26" class="amber"/>
  <text x="112" y="540" class="t p">JOIN THE WAITLIST</text>

  <!-- illustration -->
  <g transform="translate(700 150) scale(0.78)">
    <rect x="0" y="0" width="240" height="152" rx="10" class="panel"/>
    <rect x="10" y="10" width="220" height="132" rx="5" class="screen"/>
    <rect x="26" y="30" width="110" height="9" rx="4.5" class="bar"/>
    <rect x="26" y="52" width="168" height="9" rx="4.5" class="bar"/>
    <rect x="26" y="74" width="136" height="9" rx="4.5" class="bar"/>
    <rect x="106" y="152" width="26" height="40" class="panel"/>
    <rect x="70" y="192" width="100" height="11" rx="5.5" class="panel"/>

    <rect x="300" y="0" width="240" height="152" rx="10" class="panel"/>
    <rect x="310" y="10" width="220" height="132" rx="5" class="screen"/>
    <rect x="326" y="30" width="188" height="52" rx="5" class="foam"/>
    <rect x="326" y="96" width="120" height="9" rx="4.5" class="bar"/>
    <rect x="326" y="118" width="150" height="9" rx="4.5" class="bar"/>
    <rect x="406" y="152" width="26" height="40" class="panel"/>
    <rect x="370" y="192" width="100" height="11" rx="5.5" class="panel"/>

    <rect x="180" y="222" width="180" height="48" rx="7" class="panel"/>
    <rect x="196" y="238" width="148" height="7" rx="3.5" class="bar"/>
    <rect x="196" y="252" width="108" height="7" rx="3.5" class="bar"/>

    <rect x="60" y="300" width="200" height="92" rx="13" class="panel"/>
    <rect x="78" y="316" width="78" height="60" rx="6" class="foam"/>
    <rect x="166" y="316" width="76" height="60" rx="6" class="foam"/>
    <rect x="280" y="300" width="200" height="92" rx="13" class="panel"/>
    <rect x="298" y="316" width="140" height="28" rx="6" class="foam"/>
    <rect x="298" y="352" width="50" height="24" rx="6" class="foam"/>
    <rect x="358" y="352" width="80" height="24" rx="6" class="foam"/>
    <rect x="48" y="330" width="16" height="32" rx="5" class="amber"/>
    <rect x="476" y="330" width="16" height="32" rx="5" class="amber"/>
  </g>
</svg>
