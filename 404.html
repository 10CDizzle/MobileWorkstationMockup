<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Casework</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#11212f">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<!-- Styles are inlined: GitHub Pages serves this file for unknown URLs at any
     depth, where a relative stylesheet link would not resolve. -->
<style>
  :root {
    --bg: #fbf9f6; --ink: #11212f; --ink-soft: #42535f;
    --accent: #d97a12; --surface: #ffffff; --line: #e2dcd2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1620; --ink: #edf2f6; --ink-soft: #a9bcc9;
      --accent: #f2a33c; --surface: #132433; --line: #22384a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 1.0625rem; line-height: 1.6;
    padding: 2rem 1.5rem;
  }
  .box { max-width: 30rem; text-align: center; }
  svg { width: 92px; height: 92px; margin: 0 auto 1.5rem; display: block; }
  .st { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; }
  .ac { fill: var(--accent); }
  h1 { font-size: clamp(1.8rem, 5vw, 2.4rem); letter-spacing: -.02em; margin: 0 0 .75rem; }
  p { color: var(--ink-soft); margin: 0 0 2rem; }
  a.btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: .78rem 1.35rem; border-radius: 999px;
    background: var(--accent); color: #1a1206;
    font-weight: 600; text-decoration: none;
  }
  a.btn:hover { filter: brightness(.94); }
  a.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
  <main class="box">
    <svg viewBox="0 0 64 64" role="img" aria-label="An empty case">
      <rect x="7" y="20" width="50" height="33" rx="7" class="st"/>
      <path d="M23 20v-4a5 5 0 0 1 5-5h8a5 5 0 0 1 5 5v4" class="st"/>
      <path d="M24 32l16 10M40 32L24 42" class="st" stroke="currentColor"/>
      <rect x="28" y="53" width="8" height="5" rx="2" class="ac"/>
    </svg>
    <h1>This case is empty.</h1>
    <p>
      That page does not exist &mdash; or it has not been built yet. We are pre-launch,
      so there is a decent chance it is the second one.
    </p>
    <a class="btn" href="/" id="home">Back to Casework</a>
  </main>
  <script>
    /* Keep the link working when the site lives under a repo subpath
       such as https://user.github.io/casework-landing/. */
    (function () {
      var seg = window.location.pathname.split('/')[1];
      var host = window.location.hostname;
      if (seg && host.indexOf('github.io') !== -1) {
        document.getElementById('home').setAttribute('href', '/' + seg + '/');
      }
    }());
  </script>
</body>
</html>
